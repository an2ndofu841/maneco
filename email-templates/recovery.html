<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マネコ - パスワード再設定</title>
</head>
<body style="margin:0; padding:0; background-color:#f1f5f9; font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#0f172a;">

<div style="display:none; max-height:0; overflow:hidden; opacity:0;">
パスワード再設定リンクが届きました。リンクは1時間有効です🐱
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9; padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; width:100%;">

        <tr>
          <td align="center" style="padding:8px 0 24px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="background:linear-gradient(135deg,#6366f1 0%,#0ea5e9 100%); width:40px; height:40px; border-radius:10px; text-align:center; vertical-align:middle;">
                  <span style="color:#ffffff; font-size:22px; line-height:40px;">🐱</span>
                </td>
                <td style="padding-left:10px; font-weight:bold; font-size:20px; color:#0f172a;">maneco</td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff; border-radius:24px;">
              <tr>
                <td align="center" style="padding:40px 32px 24px 32px;">
                  <div style="width:64px; height:64px; background:linear-gradient(135deg,#f97316 0%,#ec4899 100%); border-radius:20px; text-align:center; line-height:64px; font-size:32px; margin:0 auto 16px auto;">🔑</div>
                  <p style="margin:0 0 6px 0; font-size:11px; font-weight:bold; color:#ec4899; letter-spacing:1.5px;">PASSWORD RESET</p>
                  <h1 style="margin:0 0 12px 0; font-size:24px; font-weight:900; color:#0f172a; line-height:1.4;">
                    パスワードを再設定する
                  </h1>
                  <p style="margin:0 0 28px 0; font-size:14px; color:#475569; line-height:1.7;">
                    パスワード再設定のリクエストを受け付けました。<br>
                    下のボタンから新しいパスワードを設定してください。
                  </p>

                  <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block; background:linear-gradient(135deg,#f97316 0%,#ec4899 100%); color:#ffffff; text-decoration:none; padding:16px 40px; border-radius:999px; font-weight:bold; font-size:16px; box-shadow:0 8px 20px rgba(236,72,153,0.35);">
                    パスワードを再設定する →
                  </a>

                  <p style="margin:20px 0 0 0; font-size:12px; color:#94a3b8;">
                    ⏱ このリンクは <strong style="color:#475569;">1時間</strong> 有効です
                  </p>
                </td>
              </tr>

              <tr>
                <td style="padding:0 32px 32px 32px;">
                  <div style="height:1px; background-color:#f1f5f9; margin-bottom:20px;"></div>
                  <p style="margin:0 0 8px 0; font-size:12px; font-weight:bold; color:#64748b;">ボタンが押せない場合</p>
                  <p style="margin:0; padding:10px 12px; background-color:#f8fafc; border-radius:8px; border:1px solid #e2e8f0; word-break:break-all; font-size:12px; color:#334155; font-family:'SF Mono','Monaco','Consolas',monospace;">
                    {{ .ConfirmationURL }}
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:20px 0 8px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fef2f2; border:1px solid #fecaca; border-radius:16px;">
              <tr>
                <td style="padding:14px 20px;">
                  <p style="margin:0; font-size:12px; line-height:1.7; color:#991b1b;">
                    <strong>🛡 リクエストした覚えがない場合:</strong> このメールは無視してください。リンクをクリックしない限り、パスワードは変更されません。
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding:24px 16px;">
            <p style="margin:0; font-size:11px; color:#cbd5e1;">© 2026 maneco</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
